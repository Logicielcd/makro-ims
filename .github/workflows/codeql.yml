name: "CodeQL Advanced"

on:
  push:
    branches: [ "yard-management" ]
  pull_request:
    branches: [ "yard-management" ]
  schedule:
    - cron: '22 11 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 1   # 🔒 prevent cache collision
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          cache: false   # 🚫 disable CodeQL cache to avoid conflict

          # 🔍 increase detection coverage (especially JS/TS)
          queries: security-extended,security-and-quality

      # Manual build only if needed
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo "Manual build not configured"
          exit 1

      # Analyze
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      # Upload SARIF (do not fail if no findings)
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/**/*.sarif
          if-no-files-found: warn
