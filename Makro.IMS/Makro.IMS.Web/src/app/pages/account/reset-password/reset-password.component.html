<p-toast></p-toast>
<p-confirmDialog
  [baseZIndex]="10000"
  rejectButtonStyleClass="p-button-text"
></p-confirmDialog>
<p-toolbar>
    <div class="p-toolbar-group-left">
        <h5>Reset Password</h5>
    </div>
</p-toolbar>


<form [formGroup]="loginForm">
<div class="card">
    <div class="formgrid grid p-fluid">    
        <div class="field col-12 md:col-4">
            <label>
                User Login Name                
            </label>       
            <input
                pInputText
                type="text"
                id="userid"
                name="userid"
                #userid="ngModel"                
                [(ngModel)]="data.userId"
                [ngModelOptions]="{standalone: true}"
                readonly                               
                placeholder="User login name"
            />             
        </div>
        <div class="field col-12 md:col-8">

        </div>
        <div class="field col-12 md:col-4">
            <label>
                First Name            
            </label>       
            <input
                pInputText
                type="text"
                id="username"
                name="username"
                #username="ngModel"
                [(ngModel)]="data.name"
                [ngModelOptions]="{standalone: true}"
                readonly
                placeholder="first name"
            />             
        </div>
        <div class="field col-12 md:col-4">
            <label>
                Last Name            
            </label>       
            <input
                pInputText
                type="text"
                id="lastname"
                name="lastname"
                #lastname="ngModel"
                [(ngModel)]="data.lastname"
                [ngModelOptions]="{standalone: true}"
                readonly                               
                placeholder="lastname"
            />             
        </div>
        <div class="field col-12 md:col-4">

        </div>
        <div class="field col-12 md:col-4">
            <label>
                New Password            
            </label>       
            <p-password id="password1" label="password1" match="confirmpassword1" required [inputStyle]="{'width':'100%'}" [style]="{'width':'100%'}" formControlName="password">
                <ng-template pTemplate="header">
                    <h6>Pick a password</h6>
                </ng-template>
                <ng-template pTemplate="footer">
                    <p-divider></p-divider>
                    <p class="mt-3">Required</p>
                    <ul class="pl-3 ml-3 mt-0" style="line-height: 1.5">
                        <li>At least one lowercase</li>
                        <li>At least one uppercase</li>
                        <li>At least one numeric</li>
                        <li>At least one special character</li>
                        <li>Minimum 8 characters</li>
                    </ul>
                </ng-template>
              </p-password>             
        </div>
        <div class="field col-12 md:col-8"></div>
        <div class="field col-12 md:col-4">
            <ng-container *ngFor="let error of error_messages.password">
                <div class="error-message" *ngIf="loginForm.get('password').hasError(error.type) && (loginForm.get('password').dirty || loginForm.get('password').touched)">
                    {{ error.message }}
                </div>
            </ng-container>
        </div>
        <div class="field col-12 md:col-8"></div>
        <div class="field col-12 md:col-4">
            <label for="confirmpassword1">Confirm Password</label>
            <div class="field">
            <p-password id="confirmpassword1" label="confirmpassword1" [feedback]="false" required [inputStyle]="{'width':'100%'}" [style]="{'width':'100%'}" formControlName="confirmpassword"
            >
            </p-password>
            </div>
        </div>
        <div class="field col-12 md:col-8"></div>
        <div class="col-12 md:col-4">
            <ng-container *ngFor="let error of error_messages.confirmpassword">
                <div class="error-message" *ngIf="loginForm.get('confirmpassword').hasError(error.type) && (loginForm.get('confirmpassword').dirty || loginForm.get('confirmpassword').touched)">
                    {{ error.message }}
                </div>          
            </ng-container>
            <div class="error-message" *ngIf="confirmPassword">
            {{ confirmPassword }}
            </div>
        </div>
        <div class="col-12 md:col-8">

        </div>
        <div class="col-12 md:col-4">
            <button 
            pButton
            pRipple 
            type="button" 
            class="w-full p-3 text-xl text-center"
            [disabled]="!loginForm.valid" 
            label="Reset"
            (click)="resetpassword()">
          </button>
        </div>
    </div> 
</div>  
</form>
