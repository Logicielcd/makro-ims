<p-toast position="top-right" class="-mt-2" key="dg"></p-toast>

<div class="formgrid grid p-fluid mt-3">
  <div class="field col-10 md:col-10">
    <label id="lblinput" for="pono" name="lblinput" >
      {{inputLabel}} <span class="p-error"> *</span>
    </label>
    <input
      pInputText
      type="text"
      id="pono"
      name="pono"
      #pono="ngModel"
      [(ngModel)]="poNo"
      required
      [ngClass]="{
          'ng-invalid ng-dirty':
          pono.invalid && (pono.dirty || pono.touched)
      }"
      (keydown.enter)="checkPo()"
      [placeholder]="inputLabel"
    />               
  </div>
  <div class="field col-2 md:col-2 align-items-center justify-content-center">
    <div class="surface-overlay align-items-center justify-content-center">      
      <label><span class="text-lg font-bold">Total PO</span></label>      
    </div>
    <div class="surface-overlay flex min-h-full align-items-center justify-content-center -mt-2">      
      <label><span class="text-2xl font-bold">{{ totalPo }}</span></label>      
    </div>
  </div>
  <div class="field col-12 md:col-12">
    <p-table [columns]="cols" [value]="poCheckIns" dataKey="id">
      <ng-template pTemplate="header" let-columns>
        <tr>              
            <th *ngFor="let col of columns">&#123;&#123;col.header&#125;&#125;</th>
            <th> Action </th>
        </tr>
          <!-- <tr>            
            <th *ngFor="let col of columns">
              <p-columnFilter type="text" [field]="col.field" [matchModeOptions]="matchModeOptions" [matchMode]="CONTAINS"></p-columnFilter>
          </th>
        </tr> -->
      </ng-template>
      <ng-template pTemplate="body" let-polist>
        <tr>                            
          <td>{{polist.poNbr}}</td>
          <td>
            <button
              pButton
              pRipple
              icon="pi pi-trash"
              class="p-button-rounded p-button-warning"
              (click)="deletePo(polist)"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
