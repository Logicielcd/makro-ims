<p-toast position="top-right" class="-mt-2" key="dg"></p-toast>

<div class="formgrid grid p-fluid mt-5 justify-content-center gap-4 ">
  <div class="flex align-items-center">
    <p-radioButton name="waiting" value="Y" [(ngModel)]="waitingDoc" inputId="waitingDocYes"></p-radioButton>
    <label for="waitingDocYes" class="ml-2">รอรับเอกสาร</label>
  </div>
  <div class="flex align-items-center">
      <p-radioButton name="waiting" value="N" [(ngModel)]="waitingDoc" inputId="waitingDocNo"></p-radioButton>
      <label for="waitingDocNo" class="ml-2">ไม่รับเอกสาร</label>
  </div>
</div>
<div class="grid col-12">
  <div class="field col-12 md:col-12">
    <label id="lblinput" for="remark" name="lblinput" >
      {{inputLabel}}
    </label>
    <input
      pInputText
      type="text"
      id="remark"
      name="remark"
      class="w-12"
      [(ngModel)]="remark"      
      [placeholder]="inputLabel"
    />
  </div>
  <div class="field col-12 md:col-5">
    <button
      pButton
      type="button"
      class="p-button w-12"          
      label="OK"
      (click)="onConfirm()"
    ></button>
  </div>
  <div class="field col-12 md:col-2"></div>
  <div class="field col-12 md:col-5">
    <button
      pButton
      type="button"
      class="p-button-warning w-12"          
      label="CANCEL"
      (click)="onCancel()"
    ></button>
  </div>
  <!-- <div class="field col-12 md:col-5">
    <button
      pButton
      type="button"
      class="p-button-danger w-12"          
      label="CANCEL PO"
      (click)="onCancelPo()"
    ></button>
  </div> -->
</div>
