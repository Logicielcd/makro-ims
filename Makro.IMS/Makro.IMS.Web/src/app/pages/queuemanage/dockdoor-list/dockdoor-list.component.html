<p-toast></p-toast>
<p-confirmDialog
  [baseZIndex]="10000"
  rejectButtonStyleClass="p-button-text"
></p-confirmDialog>
<div class="card col-12 p-0 md:p-3">
  <div class="flex justify-content-between flex-wrap">
    <div class="flex align-item-center justify-content-center">
      <h3 class="font-bold">OPS Process</h3>
    </div>
    <div class="flex align-item-center justify-content-center">
      <div class="align-item-center mr-2 ">
        <p-button icon="pi pi-refresh" (click)="refresh()"></p-button>
      </div>
    </div>    
  </div>
  <div class="w-full md:w-12 mx-auto">
    <p-messages [(value)]="msgs" [enableService]="false"></p-messages>
  </div>

  <div class="mt-2">
    <div class="formgrid grid p-fluid">   
      <div class="field col-12 md:col-3">
        <label>
            Warehouse
        </label>
        <p-dropdown
          id="warehouseCode"
          name="warehouseCode"
          #warehouseCode="ngModel"
          [options]="warehouses"
          [(ngModel)]="selectedWhse"
          optionLabel="warehouseCode"
          optionValue="warehouseCode"
          [filter]="true"
          filterBy="warehouseCode"
          [showClear]="true"
          [placeholder]="'Select Warehouse' | translate"
          required
          [ngClass]="{
            'ng-invalid ng-dirty':
              warehouseCode.invalid &&
              (warehouseCode.dirty || warehouseCode.touched)
          }"
          (onChange)="onWhseChange()"
        >
          <ng-template let-item pTemplate="item">
            {{item.warehouseCode}} - {{item.warehouseName}}
          </ng-template>
              
          <ng-template let-item pTemplate="selectedItem">
            {{item.warehouseCode}} - {{item.warehouseName}}
          </ng-template>
        </p-dropdown>
        <small
          class="p-error block"
          *ngIf="
            warehouseCode.invalid &&
            (warehouseCode.dirty || warehouseCode.touched)
          "
        >
          {{
            "Message.Validation.Required"
              | translate: { field: "Label.WarehouseCode" | translate }
          }}
        </small>
      </div>
      <div class="field col-12 md:col-2">
        <label>
            Operation Type
        </label>
        <p-dropdown
            id="operationtype"
            name="operationtype"
            #operationtype="ngModel"
            [options]="operationtypes"
            [(ngModel)]="selectedoperationtype"
            optionLabel="description"
            optionValue="operationName"
            [placeholder]="'Select Operation type' | translate"
            (onChange)="onOperationChange()"
        >
        </p-dropdown>
      </div>
      <div class="field col-12 md:col-12">
        <p-table
          [value]="dataSource"
          [paginator]="true"
          [rows]="5"
          [showCurrentPageReport]="true"
          [tableStyle]="{ 'min-width': '50rem' }"
          currentPageReportTemplate="{first} to {last} of {totalRecords}"
          [rowsPerPageOptions]="[5,10, 20, 30]"
          [columns]="cols"
          [scrollable]="true"
        >
          
          <ng-template pTemplate="header" let-columns>
            <tr>            
              <th
                *ngFor="let col of columns"
                [pSortableColumn]="col.field"
                [style.width]="col.width || defaultWidth"
                style="white-space: pre-line;"
                class="text-center"
              >
                {{ col.header | translate }}
              </th>
              <th class="text-center">
                Action
              </th>
            </tr>
          </ng-template>        
          <ng-template pTemplate="body" let-rowData let-columns="columns" >
            <tr>            
              <td
                *ngFor="let col of columns; index as i"
                [style.width]="col.width || defaultWidth"
                class="text-center"
              >
                <i *ngIf="col.field === 'status'"
                  class="pi pi-circle-fill"
                  [ngClass]="{
                    'true-icon': rowData['bookingSup'] === null,
                    'false-icon': rowData['bookingSup'] !== null
                  }"
                  style="font-size: 2rem"
                ></i><br>
                <span *ngIf="col.display === 'string'" style="white-space: pre-line;">{{
                  rowData[col.field]
                }}</span>
              </td>
              <td>
                <div class="flex align-items-center justify-content-center">
                  <!-- <button pButton icon="pi pi-cog" class="p-button mr-2" style="width:100px" (click)="onManageQueue(rowData)"></button> -->
                  <button pButton class="p-button mr-2" (click)="onTracking(rowData)" label="Tracking"></button>
                  <button pButton class="p-button mr-2" (click)="onCallTruck(rowData)" label="เรียกรถ" *ngIf="rowData['bookingSup'] === null"></button>
                  <button pButton class="p-button mr-2" (click)="onUpdate(rowData)" label="update" *ngIf="rowData['bookingSup'] !== null"></button>
                </div>
                <!-- <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="deleteProduct(product)"></button> -->
              </td>
            </tr>
        </ng-template>
      </p-table>
      
      </div>
    </div>
  </div>
</div>
