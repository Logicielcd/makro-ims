<div class="surface-card p-4">
  <div class="flex flex-column md:flex-row md:justify-content-between mb-3">
    <div class="flex align-items-center">
      <p-button
        label="Clear"
        icon="pi pi-filter-slash"
        (onClick)="clear(dt)"
        severity="help"
        class="mr-2"
      ></p-button>
      <span class="p-input-icon-left w-full md:w-20rem">
        <i class="pi pi-search"></i>
        <input
          #filter
          pInputText
          type="text"
          (input)="onGlobalFilter(dt, $event)"
          placeholder="Search yards..."
          class="w-full"
        />
      </span>
    </div>
    <div class="mt-3 md:mt-0">
      <p-dropdown
        [options]="yardTypes"
        [(ngModel)]="selectedYardType"
        (onChange)="onYardTypeChange()"
        placeholder="Select yard type"
        [showClear]="true"
        styleClass="w-full md:w-15rem"
      >
      </p-dropdown>
      <p-button
        label="Refresh"
        icon="pi pi-refresh"
        (onClick)="refresh()"
        class="md:ml-2"
      ></p-button>
    </div>
  </div>
  <p-table
    #dt
    [value]="yards"
    [rows]="10"
    [paginator]="true"
    [loading]="loading"
    [globalFilterFields]="['yardNo', 'yardType', 'yardZone', 'locationNo']"
    [(selection)]="selectedYard"
    selectionMode="single"
    [rowHover]="true"
    dataKey="id"
    styleClass="p-datatable-sm p-datatable-gridlines"
    scrollable="true"
    scrollHeight="400px"
    (onRowSelect)="onYardSelect($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 20%">Yard No</th>
        <th style="width: 20%">Yard Type</th>
        <th style="width: 20%">Yard Zone</th>
        <th style="width: 20%">Location Type</th>
        <th style="width: 20%">Location No</th>
        <th class="text-center" style="width: 10%">Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-yard>
      <tr [pSelectableRow]="yard">
        <td>{{ yard.yardNo }}</td>
        <td>{{ yard.yardType }}</td>
        <td>{{ yard.yardZone }}</td>
        <td>{{ yard.trailerType }}</td>
        <td>{{ yard.locationNo }}</td>
        <td>
          <p-tag
            [value]="yard.status"
            [severity]="yard.status === 'Available' ? 'success' : 'danger'"
          ></p-tag>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center p-4">No yards found.</td>
      </tr>
    </ng-template>
  </p-table>
  <div class="flex justify-content-end gap-2 mt-3">
    <p-button
      label="Select"
      icon="pi pi-check"
      (onClick)="selectYard()"
      [disabled]="!selectedYard"
    ></p-button>
    <p-button
      label="Cancel"
      icon="pi pi-times"
      (onClick)="cancel()"
      severity="secondary"
    ></p-button>
  </div>
</div>
