<p-toast></p-toast>
<p-confirmDialog
  [baseZIndex]="10000"
  rejectButtonStyleClass="p-button-text"
></p-confirmDialog>
<div class="card col-12 p-0 md:p-3 bg-red-300">
  <div class="flex justify-content-between flex-wrap">
    <div class="flex align-item-center justify-content-center">
      <h3 class="font-bold">Guard Check-out</h3>
    </div>
    <div class="flex align-item-center justify-content-center">
      <div class="align-item-center mr-2 ">
        <p-button icon="pi pi-refresh" (click)="refresh()"></p-button>
      </div>
    </div>    
  </div>
  <div class="w-full md:w-12 mx-auto">
    <p-messages [(value)]="msgs" [enableService]="false"></p-messages>
  </div>

  <div class="formgrid grid p-fluid justify-content-start mt-2">
    <div class="field col-12 md:col-4">      
      <label htmlFor="gatepass">
          {{ "Label.GatePass" | translate }}
          <span class="p-error"> *</span>
      </label>            
      <input
        pInputText
        type="text"
        id="gatepass"
        name="gatepass"
        #gatepass="ngModel"
        [(ngModel)]="gatePass"
        required
        [ngClass]="{
          'ng-invalid ng-dirty':
          gatepass.invalid && (gatepass.dirty || gatepass.touched)
        }"
        (keydown.enter)="onGatePass()"
      />
      <small
        class="p-error block"
        *ngIf="gatepass.invalid && (gatepass.dirty || gatepass.touched)"
      >
        {{
          "Message.Validation.Required"
            | translate : { field: "Label.GatePass" | translate }
        }}
      </small>
    </div>
    <div class="field col-12 md:col-1">
      <button 
        pButton
        type="button" 
        class="p-button"
        (click)="onGatePass()"
        label="OK"
        icon="pi pi-check"
        style="margin-top:1.5rem"
        >
      </button>
    </div>
  </div>
</div>
