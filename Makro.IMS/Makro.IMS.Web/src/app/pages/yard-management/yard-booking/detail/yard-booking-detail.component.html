<p-toast></p-toast>
<p-confirmDialog
  [baseZIndex]="10000"
  rejectButtonStyleClass="p-button-text"
></p-confirmDialog>
<div class="card col-12 p-0 md:p-3">
  <div class="flex justify-content-between flex-wrap">
    <div class="flex align-item-center justify-content-center">
      <h3 class="font-bold">Booking Detail</h3>
    </div>
    <div class="flex align-item-center justify-content-right">
      <div class="flex-wrap justify-content-start w-10rem mr-2">
        <p-splitButton 
          label="Action" 
          styleClass="ml-2 mr-2" 
          icon="pi pi-bolt" 
          [model]="this.menuItems$ | async"                  
        >
        </p-splitButton>
      </div>
      <div class="align-item-center ml-2">
        <p-button icon="pi pi-refresh" (click)="refresh()"></p-button>
      </div>
      <div class="align-item-center ml-2">
        <p-button
          icon="pi pi-times"
          (click)="onBack()"
          [loading]="isLoading"
        ></p-button>
      </div>
    </div>    
  </div>
  <div class="w-full md:w-12 mx-auto">
    <p-messages [(value)]="msgs" [enableService]="false"></p-messages>
  </div>

  <div class="flex flex-row justify-content-between">
    <div *ngIf="bookingKeyDto" class="pt-2">
      <form #supForm="ngForm">
        <div class="formgrid grid p-fluid">
          <div class="field col-12 md:col-4">
            <label>
              Supplier
              <span class="p-error"> *</span>
            </label>
            <input
              id="supplier"
              pInputText
              type="text"
              #supplier="ngModel"
              [(ngModel)]="supplierDisplay"
              name="supplier"
              readonly
              placeholder="Input supplier"
            />
          </div>

          <div class="field col-12 md:col-3">
            <label for="bookingDate">Delivery Date</label>
            <p-calendar
              [(ngModel)]="bookingDate"
              dateFormat="dd/mm/yy"
              inputId="bookingDate"
              showIcon="true"
              required
              name="bookingdate"
              #bookingdate="ngModel"              
              [disabled]="!allowToEdit"
            >
            </p-calendar>            
          </div>         
          <div class="flex field col-12 md:col-2">
            <div *ngIf="supplierGroup" class="flex-wrap ml-5 mt-5">
              <label class="text-4xl font-bold text-red-500"> {{supplierGroup.isVip}} </label>
            </div>
          </div> 
          <div class="flex field col-12 md:col-3 justify-content-end">
            <div class="flex-wrap justify-content-start w-8rem">
              <button
                pButton
                type="button"
                class="p-button mt-4"
                icon="pi pi-save"
                (click)="onSaveBooking()"
                [disabled]="!isCompleted"                
                label="Save"
                [loading]="isLoading"
              ></button>
            </div>
          </div>

          <div class="field col-12 md:col-4">
            <label for="contactName"
              >Contact name
              <span class="p-error"> *</span>
            </label>
            <input
              id="contactName"
              pInputText
              type="text"
              #contactname="ngModel"
              [(ngModel)]="contactName"
              name="contactname"
              placeholder="Input contact name"
              [readonly]="!allowToEdit"
            />
          </div>

          <div class="field col-12 md:col-3">
            <label for="telNo"
              >Tel No.
              <span class="p-error"> *</span>
            </label>
            <input
              id="telNo"
              pInputText
              type="text"
              name="telno"
              #telNo="ngModel"
              required
              [(ngModel)]="contactPhone"
              placeholder="Input tel no."
              [readonly]="!allowToEdit"
            />
          </div>

          <div class="field col-12 md:col-5">
            <label for="email">e-Mail
              <span class="p-error"> *</span>
            </label>
            <textarea
              rows="1"
              id="email"
              name="email"
              #email="ngModel"
              pInputTextarea
              [(ngModel)]="contactEmail"
              placeholder="Input email"
            ></textarea>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div>
  <form #f="ngForm" novalidate>
    <div class="formgrid grid p-fluid">
      <div class="field col-12 md:col-4">
        <label for="poNo2">PO No</label>
        <input
          pInputText
          type="text"
          id="poNo"
          name="poNo"
          #poNo="ngModel"
          [(ngModel)]="inputPoNo"
          placeholder="Input PO"
          [disabled]="!allowToEdit"
          (keydown.enter)="addPo()"
        />
      </div>
      <div class="field col-12 md:col-1">
        <button
          pButton
          type="button"
          label="Add"
          icon="pi pi-plus"
          class="p-button"
          (click)="addPo()"
          [disabled]="!allowToEdit"
          style="margin-top: 1.5rem"
          [loading]="isLoading"
        ></button>
      </div>
      <div class="field col-12 md:col-2">
        <button
          pButton
          type="button"
          label="List PO"
          class="p-button"
          icon="pi pi-search-plus"
          style="margin-top: 1.5rem"
          (click)="getPo()"
          [disabled]="!isSelect"
        ></button>
      </div>
    </div>
  </form>
  <p-tabView [scrollable]="true">
    <p-tabPanel
      [header]="item.warehouseDisplay"
      *ngFor="let item of bookingCreates; let i = index"
      [selected]="i == 0"
    >
      <ng-template pTemplate="content">
        <div class="formgrid grid p-fluid">
          <div class="field col-12 md:col-3 mt-2">
            <label class="text-lg font-bold underline ">Booking Id:</label>
            <label class="text-lg font-bold ml-2">{{item.bookingId}}</label>
            <!-- <span class="p-float-label">
              <input pInputText id="bookingId" [(ngModel)]="item.bookingId" readonly="true" />
              <label htmlFor="bookingId">Booking Id</label>
            </span> -->
          </div>
          <div class="field col-12 md:col-2 mt-2">
            <label class="text-lg font-bold underline">โซนจัดส่งสินค้า:</label>
            <label class="text-lg font-bold text-red-500 ml-2">{{item.merchTypeDisplay}}</label>
          </div>
          <div class="field flex col-12 md:col-3 mt-2">
            <label class="text-lg font-bold underline">Status:</label>
            <label class="text-lg font-bold ml-2">{{item.status}}</label>
            <!-- <p-tag class="text-lg" [style]="{ background: 'white', color: 'var(--primary-color)' }">
                {{ item.status }}
            </p-tag> -->
            <div *ngIf="item.status == 'APPROVED'" class="ml-3">
              <label class="text-lg font-bold text-red-500"> ยังไม่ได้ Assign รถ </label>
            </div>
          </div>
          <div class="flex field col-12 md:col-4 justify-content-end">
            <div class="flex-wrap justify-content-start w-8rem mr-2 " *ngIf="isAdmin">
              <button
                pButton
                type="button"
                class="p-button"
                icon="pi pi-check"
                (click)="onApproved(item)"
                label="Approved"
                [disabled]="!isApproved"                
                [loading]="isLoading"
              >              
            </button>
            </div>            
            <div class="flex-wrap justify-content-start w-8rem">
              <button
                pButton
                type="button"
                class="p-button-warning"
                icon="pi pi-trash"
                (click)="onDeleteBookingWarehouse(item)"
                label="Delete"
                
                [loading]="isLoading"
                [disabled]="canDelete(item)"
              ></button>
            </div>
          </div>                    
          <div *ngIf="user.userType !== 'SUP'" class="field flex col-12 md:col-12 m-0 p-0" >
            <div class="field col-12 md:col-1 mt-2">
              <label class="text-lg font-bold">Truck Group : </label>
            </div>
            <div class="field col-12 md:col-2 align-item-left">
              <p-toggleButton 
                [(ngModel)]="item.backHaul"                 
                onLabel="BackHaul" 
                offLabel="ส่งสินค้าปกติ"
                (onChange)="onBackhaulChange(item)"
                [disabled]="!isBh"
              >
              </p-toggleButton>
            </div>
            <div class="flex-row col-12 md:col-2 " *ngIf="isBh">
              <button
                pButton
                type="button"
                class="p-button"
                icon="pi pi-check"
                (click)="backhaulSave(item)"
                label="Update Back Haul"
                [disabled]="!isBh"
                [loading]="isLoading"
              >              
              </button>
            </div>
            <div class="flex-row col-12 md:col-2 " *ngIf="isDcDelay">
                <button
                  pButton
                  type="button"
                  class="p-button"
                  icon="pi pi-check"
                  (click)="dcDelaySave(item)"
                  label="Update DC Delay"
                  [disabled]="!isDcDelay"
                  [loading]="isLoading"
                >              
                </button>
            </div>
          </div>
        </div>        
        <p-tabView [scrollable]="true">
          <p-tabPanel header="PO List">
            <ng-template pTemplate="content">
              <div class="field col-12 md:col-12 -ml-5 -mt-5">
                <p-table
                  [columns]="item.whseCap == 'CS' ? colsCs : cols"
                  [value]="item.bookingDetail"
                  responsiveLayout="scroll"
                >
                  <ng-template pTemplate="header" let-columns>
                    <tr>
                      <th *ngFor="let col of columns">
                        {{ col.header }}
                      </th>
                      <th>
                      </th>
                      <th class="w-10rem">

                        <div *ngIf="user.userType !== 'SUP' && item.isLate" class="field col-12 md:col-12 m-0 p-0">
                          <div class="flex align-items-center">
                            <p-checkbox 
                                name="approved" 
                                value="true" 
                                [(ngModel)]="item.allApproved"
                                (onChange)="onAllDcDelayClick($event)"
                                inputId="approved1" />
                            <label for="approved1" class="ml-2">
                                All DC Delay
                            </label>
                        </div>                        
                        </div>
                      </th>
                    </tr>
                  </ng-template>
                  <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr>
                      <td
                      *ngFor="let col of columns; index as i"
                      [style.width]="col.width || defaultWidth"                          
                      >
                        <span *ngIf="col.display === 'string'"  style="white-space: pre-line;">{{
                          rowData[col.field]
                        }}</span>
                        
                        <span *ngIf="col.display === 'datetime'"
                          >{{ rowData[col.field] | date: "dd/MM/yyyy HH:mm:ss" }}
                        </span>
                        <span *ngIf="col.display === 'date'"
                          >{{ rowData[col.field] | date: "dd/MM/yyyy" }}
                        </span>
                        <span *ngIf="col.display === 'icon' && rowData[col.field] === 'Y'"
                              ><i class="pi pi-clock" style="color: red; font-size: 1.5rem;"></i>
                        </span>
                      </td>
                      <td>
                        <button
                          pButton
                          pRipple
                          icon="pi pi-trash"
                          class="p-button-rounded p-button-warning"
                          (click)="deletePo(rowData)"
                          [disabled]="!allowToEdit"
                        ></button>
                      </td>
                      <td>                            
                        <div *ngIf="user.userType !== 'SUP' && rowData['alert'] === 'Y'" class="field col-12 md:col-12 m-0 p-0">
                          <p-toggleButton 
                            [(ngModel)]="rowData['isPostPoned']" 
                            onLabel="DC Delay" 
                            offLabel="Not Receive On-Time"
                            (onChange)="onPostponedChange(rowData)"
                          >
                          </p-toggleButton>
                        </div>
                      </td>
                    </tr>                    
                  </ng-template>
                </p-table>
              </div>
            </ng-template>
          </p-tabPanel>
          <p-tabPanel header="Truck List">
            <ng-template pTemplate="content">
              <form #truckForm="ngForm">
                <div class="formgrid grid p-fluid -ml-5 -mt-3">
                  <div class="field col-12 md:col-3">
                    <label for="truckType">Truck Type</label>
                    <p-dropdown
                      id="truckType"
                      name="truckType"
                      #truckType="ngModel"
                      [options]="trucks"
                      [(ngModel)]="item.truckSelected"
                      optionLabel="truckName"
                      optionValue="internalTruckId"
                      [filter]="true"
                      filterBy="internalTruckId"
                      [showClear]="true"
                      placeholder="Select Truck Type"
                      [readonly]="!allowToEdit"
                      required
                      [ngClass]="{
                        'ng-invalid ng-dirty':
                          truckType.invalid &&
                          (truckType.dirty || truckType.touched)
                      }"
                      [virtualScroll]="true"
                      [virtualScrollItemSize]="38"
                      (onChange)="onTruckSelected(item.warehouseCode, $event)"
                    >
                    </p-dropdown>
                    <small
                      class="p-error block"
                      *ngIf="
                        truckType.invalid &&
                        (truckType.dirty || truckType.touched)
                      "
                    >
                      {{
                        "Message.Validation.Required"
                          | translate
                            : { field: "Label.SupplierCode" | translate }
                      }}
                    </small>
                  </div>
                  <div class="field col-12 md:col-1">
                    <label for="totaltruck">Total Truck</label>
                    <input
                      pInputText
                      type="text"
                      id="totaltruck"
                      name="totaltruck"
                      [(ngModel)]="item.totalTruck"
                      required
                      (keypress)="keyPressNumbers($event)"
                    />
                  </div>
                  <div class="field col-12 md:col-2">
                    <button
                      pButton
                      type="button"
                      class="p-button"
                      (click)="addTruck(item.warehouseCode)"
                      [disabled]="!truckForm.form.valid"
                      label="Add"
                      icon="pi pi-plus"
                      style="margin-top: 1.5rem"
                    ></button>
                  </div>
                </div>
              </form>
              <div class="field col-12 md:col-12 -ml-5 -mt-3">
                <p-table
                  [columns]="truckCols"
                  [value]="item.bookingTruck"
                  responsiveLayout="scroll"
                >
                  <ng-template pTemplate="header" let-columns>
                    <tr>
                      <th *ngFor="let col of columns">
                        {{ col.header }}
                      </th>
                    </tr>
                  </ng-template>
                  <ng-template
                    pTemplate="body"
                    let-rowData
                    let-columns="columns"
                  >
                    <tr>
                      <td *ngFor="let col of columns">
                        {{ rowData[col.field] }}
                      </td>
                      <td>
                        <button
                          pButton
                          pRipple
                          icon="pi pi-trash"
                          class="p-button-rounded p-button-warning"
                          (click)="deleteTruck(rowData)"
                          [disabled]="!allowToEdit"
                        ></button>
                      </td>
                    </tr>
                  </ng-template>
                </p-table>
              </div>
            </ng-template>
          </p-tabPanel>
          <p-tabPanel header="Assign Time slot">
            <ng-template pTemplate="content">
              <div class="formgrid grid p-fluid -ml-5 -mt-3">
                <div class="field col-12 md:col-2">
                  <label for="dockdoor">Dock Door</label>
                  <input
                    pInputText
                    type="text"
                    id="dockdoor"
                    name="dockdoor"
                    [(ngModel)]="item.dockDoor"
                    readonly
                  />
                </div>
                <div class="field col-12 md:col-2">
                  <label for="timeStart">Time start</label>
                  <p-calendar
                    [(ngModel)]="item.startTime"
                    [showTime]="true"
                    [showSeconds]="true"
                    inputId="starttime"
                    dateFormat="dd/mm/yy"
                    disabled
                  >
                  </p-calendar>
                </div>
                <div class="field col-12 md:col-2">
                  <label for="timeStart">Time End</label>
                  <p-calendar
                    [(ngModel)]="item.endTime"
                    [showTime]="true"
                    [showSeconds]="true"
                    inputId="time"
                    dateFormat="dd/mm/yy"
                    disabled
                  >
                  </p-calendar>
                </div>
                <div class="field col-12 md:col-2">
                  <button
                    pButton
                    type="button"
                    label=""
                    class="p-button"
                    (click)="show(item.warehouseCode,item.companyCode,item.merchType)"
                    [disabled]="!allowToEdit"
                    style="margin-top: 1.5rem"
                    icon="pi pi-calendar-plus"
                  ></button>
                </div>
              </div>
            </ng-template>
          </p-tabPanel>
        </p-tabView>
      </ng-template>
    </p-tabPanel>
  </p-tabView>
</div>
