<div class="grid" *ngIf="loadCompleted === true">
  <div class="col-12 p-0 md:p-3">    
    <div class="card">
      <div class="grid grid-nogutter flex-row justify-content-between">
        <h3 class="font-bold">
          {{ (!dataId ? "Title.Create" : "Title.Detail") | translate }}
        </h3>
      </div>
      <p-messages [(value)]="msgs" [enableService]="false"> </p-messages>
      <form #f="ngForm" novalidate>
        <div class="grid">
          <div class="col-12">
            <p-toolbar>
              <div class="p-toolbar-group-left flex flex-wrap">
                <button
                  *ngIf="canModify"
                  pButton
                  type="button"
                  icon="pi pi-check"
                  [label]="'Button.Save' | translate"
                  class="p-button-success mr-2"
                  [disabled]="!f.form.valid || f.form.pristine"
                  (click)="onSubmit()"
                  [loading]="isLoading"
                ></button>
                <button
                  *ngIf="canModify"
                  pButton
                  type="button"
                  icon="pi pi-trash"
                  [label]="'Button.Delete' | translate"
                  class="p-button-danger mr-2"
                  (click)="onDelete()"
                  [loading]="isLoading"
                ></button>
              </div>
              <div class="p-toolbar-group-right flex flex-wrap">
                <button
                  pButton
                  type="button"
                  icon="pi pi-refresh"
                  [pTooltip]="'Button.Refresh' | translate"
                  tooltipPosition="bottom"
                  class="p-button-primary mr-2"
                  (click)="fetchData()"
                  [loading]="isLoading"
                ></button>
                <button
                  pButton
                  type="button"
                  icon="pi pi-times"
                  [pTooltip]="'Button.Back' | translate"
                  tooltipPosition="bottom"
                  class="p-button-primary mr-2"
                  (click)="onBack()"
                  [loading]="isLoading"
                ></button>
              </div>
            </p-toolbar>
          </div>
        </div>

        <div class="p-fluid p-formgrid grid">
          <div class="col-12 md:col-4">
            <label htmlFor="warehouse">
              {{ "Label.WarehouseCode" | translate }}
            </label>
            <p-dropdown
              id="warehouse"
              name="warehouse"
              #warehouse="ngModel"
              [options]="warehouses"
              [(ngModel)]="data.warehouseCode"
              optionLabel="warehouseName"
              optionValue="warehouseCode"                            
              [placeholder]="'Select.WarehouseCode' | translate"
              (onChange)="onWarehouseChange($event)"
              required              
              [ngClass]="{
                'ng-invalid ng-dirty':
                warehouse.invalid && (warehouse.dirty || warehouse.touched)
              }"
              [virtualScroll]="true"
              [virtualScrollItemSize]="38"
            >
              <ng-template let-item pTemplate="item">
                {{ item.warehouseCode }} - {{ item.warehouseName }}
              </ng-template>
              <ng-template let-item pTemplate="selectedItem">
                {{ item.warehouseCode }} - {{ item.warehouseName }}
              </ng-template>
            </p-dropdown>
            <small
              class="p-error block"
              *ngIf="warehouse.invalid && (warehouse.dirty || warehouse.touched)"
            >
              {{
                "Message.Validation.Required"
                  | translate : { field: "Label.WarehouseCode" | translate }
              }}
            </small>
          </div>
          <div class="col-8"></div>
          <div class="col-12 md:col-4">
            <label htmlFor="operationName">
              {{ "Label.OperationName" | translate }}
            </label>
            <input
              pInputText
              type="text"
              id="operationname"
              name="operationname"
              #operationname="ngModel"
              [(ngModel)]="data.operationName"
              required
              [ngClass]="{
                'ng-invalid ng-dirty':
                operationname.invalid && (operationname.dirty || operationname.touched)
              }"              
            />
            <small
              class="p-error block"
              *ngIf="operationname.invalid && (operationname.dirty || operationname.touched)"
            >
              {{
                "Message.Validation.Required"
                  | translate : { field: "Label.OperationName" | translate }
              }}
            </small>
          </div>

          <div class="col-12 md:col-4">
            <label htmlFor="desc">
              {{ "Label.Description" | translate }}
            </label>
            <input
              pInputText
              type="text"
              id="desc"
              name="desc"
              #desc="ngModel"
              [(ngModel)]="data.description"
              required
              [ngClass]="{
                'ng-invalid ng-dirty':
                desc.invalid && (desc.dirty || desc.touched)
              }"              
            />
            <small
              class="p-error block"
              *ngIf="desc.invalid && (desc.dirty || desc.touched)"
            >
              {{
                "Message.Validation.Required"
                  | translate : { field: "Label.Description" | translate }
              }}
            </small>
          </div>    
          <div class="col-12 md:col-4"></div>
          <div class="col-12 md:col-4">
            <label htmlFor="capacity">
              {{ "Label.Capacity" | translate }}
            </label>
            <input
              pInputText
              type="number"
              id="capacity"
              name="capacity"
              #capacity="ngModel"
              [(ngModel)]="data.capacity"
              required
              [ngClass]="{
                'ng-invalid ng-dirty':
                capacity.invalid && (capacity.dirty || capacity.touched)
              }"              
            />
            <small
              class="p-error block"
              *ngIf="capacity.invalid && (capacity.dirty || capacity.touched)"
            >
              {{
                "Message.Validation.Required"
                  | translate : { field: "Label.Capacity" | translate }
              }}
            </small>
          </div>   
          <div class="col-12 md:col-4">
            <label htmlFor="capacity">
              {{ "Label.CapacityLarge" | translate }}
            </label>
            <input
              pInputText
              type="number"
              id="capacitylarge"
              name="capacitylarge"
              #capacitylarge="ngModel"
              [(ngModel)]="data.capacityLarge"
              required
              [ngClass]="{
                'ng-invalid ng-dirty':
                capacitylarge.invalid && (capacitylarge.dirty || capacitylarge.touched)
              }"              
            />
            <small
              class="p-error block"
              *ngIf="capacitylarge.invalid && (capacitylarge.dirty || capacitylarge.touched)"
            >
              {{
                "Message.Validation.Required"
                  | translate : { field: "Label.CapacityLarge" | translate }
              }}
            </small>
          </div>         
        </div>
      </form>
      <div class="col-12 md:col-12 sd:col-12" *ngIf="dataId">       
        <p-table
          [columns]="cols"
          [value]="operationTimes"
          responsiveLayout="scroll"
        >
          <ng-template pTemplate="header" let-columns>
            <tr>
              <th *ngFor="let col of columns">
                {{ col.header }}
              </th>
              <th>
                <button
                pButton
                pRipple
                icon="pi pi-plus"
                class="p-button-rounded p-button-success"
                (click)="onAddTime()"
                [loading]="isLoading"
                ></button>
              </th>
            </tr>
          </ng-template>
          <ng-template
            pTemplate="body"
            let-rowData
            let-columns="columns"
          >
            <tr>
              <td *ngFor="let col of columns">                
                {{ rowData[col.field] | date : "HH:mm" }} 
              </td>
              <td>
                <button
                  pButton
                  pRipple
                  icon="pi pi-trash"
                  class="p-button-rounded p-button-warning"
                  (click)="onDeleteTime(rowData)"
                ></button>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
</div>
