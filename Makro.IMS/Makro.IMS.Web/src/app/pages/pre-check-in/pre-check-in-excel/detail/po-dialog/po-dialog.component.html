<div *ngIf="cols" class="mt-2">
  <div class="r-2 mb-2">
    <button
      pButton
      type="button"
      class="p-button-sm mb-2"
      icon="pi pi-plus"
      label="Confirm"
      (click)="confirm()"
    ></button>
  </div>

  <p-table [columns]="cols"  [value]="pos" [(selection)]="selectedPos" dataKey="poNbr" [tableStyle]="{'min-width': '50rem'}">
    <ng-template pTemplate="header" let-columns>
        <tr>
          <th style="width: 4rem">
            <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
          </th>
          <th *ngFor="let col of columns">&#123;&#123;col.header&#125;&#125;</th>
        </tr>
        <tr>
          <th></th>
          <th *ngFor="let col of columns">
            <p-columnFilter type="text" [field]="col.field" [matchModeOptions]="matchModeOptions" [matchMode]="CONTAINS"></p-columnFilter>
        </th>
    </ng-template>
    <ng-template pTemplate="body" let-polist>
        <tr>
            <td>
                <p-tableCheckbox [value]="polist"></p-tableCheckbox>
            </td>                        
            <td>{{polist.poNbr}}</td>            
        </tr>
    </ng-template>
  </p-table>

  </div>
