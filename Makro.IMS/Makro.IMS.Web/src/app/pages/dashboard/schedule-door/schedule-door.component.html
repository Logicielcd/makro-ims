
<div *ngIf="warehouseSelected">  
<div class="control-section">
  
  <div class="col-lg-12 content-wrapper">
    <form #f="ngForm" novalidate>
    <div class="field">
      <label>
        Warehouse        
      </label>
      <p-dropdown
        id="warehouseCode"
        name="warehouseCode"
        #warehouseCode="ngModel"
        ngModel="warehouse"
        [(ngModel)]="warehouseSelected"
        [options]="warehouses"
        optionLabel="warehouseName"
        optionValue="warehouseCode"        
        placeholder="select warehouse"
        (onChange)="onWhseChange($event)"
      >
        <ng-template let-item pTemplate="item">
          {{item.warehouseCode}} - {{item.warehouseName}}
        </ng-template>
        
        <ng-template let-item pTemplate="selectedItem">
          {{item.warehouseCode}} - {{item.warehouseName}}
        </ng-template>
      </p-dropdown>      
    </div>
    
    </form>
    <ejs-schedule 
      #scheduleObj 
      width='100%' 
      cssClass='timeline-resource' 
      height='800px' 
      [timeScale]="timeScale"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [currentView]="currentView" 
      [workHours]="workHours" 
      [selectedDate]="selectedDate" 
      [group]="group"
      [eventSettings]="eventSettings" 
      (eventRendered)="onEventRendered($event)" 
      (actionBegin)="onActionBegin($event)"
      (renderCell)="onRenderCell($event)" 
      (popupOpen)="onPopupOpen($event)" 
      (navigating)="onNavigating($event)"
      [rowAutoHeight]='false' 
      [timeZone]="timeZone"
      [workDays]="workDays"
      [firstDayOfWeek]="weekFirstDay"
      >
      <e-resources>
        <e-resource field='DoorId' title='Dock Door' [dataSource]='resourceDataSource' [allowMultiple]='allowMultiple'
          name='Booking' textField='text' idField='id' colorField='color'></e-resource>
      </e-resources>
      <e-views>
        <e-view option="TimelineDay"></e-view>        
      </e-views>
      <ng-template #resourceHeaderTemplate let-data>
        <div class='template-wrap'>
          <div class="dockdoor">{{data.resourceData.text}}</div>          
        </div>
      </ng-template>
    </ejs-schedule>
  </div>
</div>
</div>
