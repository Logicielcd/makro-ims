<div
  class="flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden"
  style="background-color: rgba(35, 112, 185, 0.853);"
>
  
  <div class="grid justify-content-center p-2 lg:p-0" style="min-width: 80%;">
    <div
      class="col-12 xl:col-6"
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 15%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
    <div class="text-6xl text-red-500 text-center bg-white p-2 -mt-6 mb-2" style="border-radius: 10px;" *ngIf="titlePage.length > 0">
      <label>{{titlePage}}</label>
    </div>

      <div
        class="h-full w-full m-0 py- px-4"
        style="
          border-radius: 53px;
          background: linear-gradient(
            180deg,
            var(--surface-50) 38.9%,
            var(--surface-0)
          );
        "
      >
        <form #f="ngForm" novalidate>
          <div class="text-center mb-5">
            <img
              src="assets/images/logo.png"
              alt="IMS"
              style="width: 70%; height: 70%"
            />
            <div class="text-900 text-3xl font-medium mb-3">Welcome</div>
            <span class="text-600 font-medium">Sign in to continue</span>
          </div>

          <div class="w-full md:w-10 mx-auto">
            <p-messages [(value)]="msgs" [enableService]="false"></p-messages>
          </div>

          <div class="w-full md:w-10 mx-auto">
            <label
              for="username"
              class="block text-900 text-xl font-medium mb-2"
            >
              Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              #username="ngModel"
              [(ngModel)]="login.username"
              type="text"
              placeholder="Username"
              pInputText
              class="w-full mb-3"
              style="padding: 1rem"
              required
              autocomplete="off"
            />

            <label
              for="password1"
              class="block text-900 font-medium text-xl mb-2"
              >Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              #password="ngModel"
              [(ngModel)]="login.password"
              placeholder="Password"
              pInputText
              class="w-full mb-3"
              style="padding: 1rem"
              required
              autocomplete="off"
            />

            <button
              pButton
              pRipple
              label="Sign In"
              class="w-full p-3 text-xl"
              [disabled]="!f.form.valid || f.form.pristine || !validateTimeZone()"
              (click)="userLogin()"
              [loading]="isLoading"
            ></button>
              
          </div>
          
          <div class="grid text-center mb-2" style="padding: 2rem;">            
            <div class="field col-6">
              <span class="text-600 font-large text-xl">
                <a routerLink="register" class="btn btn-link">Register/ลงทะเบียน</a>
              </span>
            </div>
            <div class="field col-6">
              <span class="text-600 font-large text-xl">
                <a routerLink="forgotpassword" class="btn btn-link">Forgot password/ลืมรหัสผ่าน</a>
              </span>
            </div>
          </div>  
          
          <div class="grid col-12 md:col-12 text-center mb-2" style="padding: 2rem;">
            <div class="field col-12 text-red-500">กรณีที่ไม่สามารถเข้าระบบได้ โปรดตรวจสอบ Timezone ของเครื่องคอมพิวเตอร์ ให้ตรงกับ system time zone</div>
            <div class="field col-6">
              <label class="text-red-500">Client Time zone : {{clientTimeZone}} {{clientOffsetText}} </label>
            </div>
            <div class="field col-6">
              <label class="text-red-500">System Time zone : Asia/Bangkok (UTC+7)</label>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
