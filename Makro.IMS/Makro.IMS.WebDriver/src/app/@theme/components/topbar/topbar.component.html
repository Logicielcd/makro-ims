<div class="layout-topbar">
  <a class="layout-topbar-logo" routerLink="">
    <img src="assets/images/logo.png" style="width: 50%; height: 50%" />
    <span style="margin-left: 20px;font-size: 1.25rem;">Inbound Management System - IMS</span>
  </a>

  <button
    class="p-link layout-menu-button layout-topbar-button p-trigger"
    (click)="layoutService.onMenuToggle()"
  >
    <i class="pi pi-bars"></i>
  </button>

  <button
    class="p-link layout-topbar-menu-button layout-topbar-button p-trigger"
    (click)="layoutService.showProfileSidebar()"
  >
    <i class="pi pi-user"></i>
  </button>

  <div
    class="layout-topbar-menu"
    [ngClass]="{
      'layout-topbar-menu-mobile-active':
        layoutService.state.profileSidebarVisible
    }"
  >
    <span class="mt-3">{{user.userName}}</span>
    <button class="p-link layout-topbar-button">
      <i class="pi pi-user"></i>
      <span>Profile</span>
    </button>

    <button class="p-link layout-topbar-button" (click)="userLogout()">
      <i class="pi pi-sign-out"></i>
      <span>Sign Out</span>
    </button>
  </div>
</div>
